<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Notas ARBRACOM</title>
<meta name="theme-color" content="#1d5f86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notas ARBRACOM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout limpo: resumo em uma faixa, abas (Recebimentos / Por mês / Divergências), listas em linhas que viram cartões no celular. */
:root {
  --bg: #ffffff; --soft: #f4f7f9; --fg: #15232d; --muted: #66757f; --line: #e3e9ee;
  --accent: #1d5f86; --accent-soft: #e6f0f6;
  --ok: #1f7a4a; --ok-soft: #e3f3ea;
  --warn: #9a5f07; --warn-soft: #fcf1dc;
  --bad: #b0352f; --bad-soft: #fbe6e4;
  --todo: #4757b8; --todo-soft: #e9ecfb;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #10181e; --soft: #17222a; --fg: #e5edf2; --muted: #93a3ae; --line: #26343e;
  --accent: #6cb4de; --accent-soft: #1a3344;
  --ok: #5cc98d; --ok-soft: #163126; --warn: #e5a94a; --warn-soft: #372a13;
  --bad: #ef837c; --bad-soft: #3b1f1d; --todo: #9eabf3; --todo-soft: #222849; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: max(20px, env(safe-area-inset-top, 0px)) 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; }
.wrap > * { min-width: 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin: 2px 0 0; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0; font-weight: 700; }
header { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.status { font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
.link { background: none; border: 0; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; padding: 0; text-decoration: underline; }

/* resumo */
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-block: 1px solid var(--line); }
.summary > div { padding: 16px 16px 16px 0; display: grid; gap: 4px; min-width: 0; }
.summary > div + div { padding-left: 16px; border-left: 1px solid var(--line); }
.summary .v { font-family: var(--font-num); font-size: 22px; font-weight: 600; overflow-wrap: anywhere; }
.summary .n { font-size: 12px; color: var(--muted); }
.v.bad { color: var(--bad); } .v.ok { color: var(--ok); } .v.todo { color: var(--todo); }
.minor { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: -16px; }
.minor b { color: var(--fg); font-family: var(--font-num); font-weight: 600; }
@media (max-width: 720px) {
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .summary > div:nth-child(3) { padding-left: 0; border-left: 0; }
  .summary > div:nth-child(n+3) { border-top: 1px solid var(--line); }
}

/* abas */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; font: inherit; font-weight: 700; font-size: 14px; color: var(--muted); cursor: pointer; white-space: nowrap; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab .count { font-family: var(--font-num); font-size: 12px; background: var(--soft); border-radius: 999px; padding: 1px 7px; margin-left: 4px; color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* linhas */
.list { display: grid; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) 130px 150px 190px; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.item .t { font-weight: 700; }
.item .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.item .val { font-family: var(--font-num); font-weight: 600; text-align: right; }
.item .act { display: flex; justify-content: flex-end; }
@media (max-width: 720px) {
  .item { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "t v" "w a"; gap: 8px 12px; align-items: start; }
  .item > :nth-child(1) { grid-area: t; } .item .when { grid-area: w; } .item .val { grid-area: v; } .item .act { grid-area: a; align-self: end; }
  .item .btn { padding: 8px 10px; }
  .tab { padding: 10px 8px; font-size: 13.5px; }
  .summary .v { font-size: 17px; }
  .summary > div { padding-right: 8px; }
  .summary > div + div { padding-left: 12px; }
}
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.b-bad { background: var(--bad-soft); color: var(--bad); }
.b-warn { background: var(--warn-soft); color: var(--warn); }
.b-ok { background: var(--ok-soft); color: var(--ok); }
.b-muted { background: var(--soft); color: var(--muted); }
.when .d { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.btn { font: inherit; font-weight: 700; font-size: 13px; padding: 9px 14px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
.btn-primary { background: var(--accent); color: var(--bg); }
.btn-ghost { background: none; border-color: var(--line); color: var(--fg); }
.btn-done { background: var(--ok-soft); color: var(--ok); }
.btn:disabled { opacity: 0.5; cursor: default; }
input.date, input.nf, select.st, form.add input, form.add select { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); min-width: 0; }
input.nf { width: 90px; font-family: var(--font-num); }
.subhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-top: 22px; padding-bottom: 6px; }
.subhead h3 { margin: 0; font-size: 16px; font-weight: 800; }
.subhead .tot { font-size: 12.5px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.empty { color: var(--muted); padding: 28px 0; }
.hint { font-size: 13px; color: var(--muted); margin: 10px 0 0; }

/* por mês */
.row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 120px 130px 100px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row .cod { font-family: var(--font-num); color: var(--muted); font-size: 13px; }
.row .val { font-family: var(--font-num); text-align: right; }
.row .obs { font-size: 12px; color: var(--muted); margin-top: 2px; }
.row .obs.alert { color: var(--bad); }
.row .em { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
select.st { font-weight: 700; border: 0; border-radius: 999px; padding: 4px 10px; background: var(--sbg); color: var(--sfg); }
.s-emitida { --sbg: var(--ok-soft); --sfg: var(--ok); }
.s-pendente { --sbg: var(--warn-soft); --sfg: var(--warn); }
.s-a_emitir { --sbg: var(--todo-soft); --sfg: var(--todo); }
.s-conferir { --sbg: var(--bad-soft); --sfg: var(--bad); }
@media (max-width: 720px) {
  .row { grid-template-columns: 36px minmax(0, 1fr) auto; }
  .row .stc { grid-column: 2; } .row .nfc { grid-column: 3; }
}
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.chip { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
details.add { margin-top: 24px; }
details.add summary { cursor: pointer; font-weight: 700; color: var(--accent); }
form.add { display: grid; grid-template-columns: 130px 70px minmax(0, 1fr) 120px 160px auto; gap: 8px; align-items: end; margin-top: 12px; }
form.add label { display: grid; gap: 3px; font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
@media (max-width: 720px) { form.add { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.toast { font-size: 13px; color: var(--ok); min-height: 1em; margin-top: 8px; }

/* divergências */
.avisos { list-style: none; margin: 0; padding: 0; display: grid; }
.avisos li { padding: 14px 0 14px 14px; border-bottom: 1px solid var(--line); border-left: 3px solid var(--c); display: grid; gap: 3px; }
.avisos b { font-size: 14px; }
.avisos p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 70ch; }

/* login */
#login { max-width: 360px; margin: 14vh auto 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#login form { display: grid; gap: 12px; margin-top: 20px; }
#login label { display: grid; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); }
#login input { font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
#login-msg { font-size: 13px; color: var(--bad); min-height: 1em; margin: 0; }
</style>
</head>
<body>

<div id="login">
  <div class="eyebrow">Swift fora da garantia · ARBRACOM</div>
  <h1>Controle de notas</h1>
  <form id="loginform">
    <label for="l-email">E-mail<input id="l-email" type="email" autocomplete="username" required></label>
    <label for="l-senha">Senha<input id="l-senha" type="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary" type="submit">Entrar</button>
    <p id="login-msg"></p>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <div>
      <div class="eyebrow">Swift fora da garantia · ARBRACOM</div>
      <h1>Controle de notas</h1>
    </div>
    <div class="status"><span id="conn">Carregando…</span><button class="link" id="sair" type="button">Sair</button></div>
  </header>

  <section>
    <div class="summary">
      <div><span class="eyebrow">A receber</span><span class="v" id="k-areceber">—</span><span class="n" id="k-areceber-n"></span></div>
      <div><span class="eyebrow">Vencido</span><span class="v bad" id="k-vencido">—</span><span class="n" id="k-vencido-n"></span></div>
      <div><span class="eyebrow">Recebido</span><span class="v ok" id="k-recebido">—</span><span class="n" id="k-recebido-n"></span></div>
      <div><span class="eyebrow">Falta tirar nota</span><span class="v todo" id="k-aemitir">—</span><span class="n" id="k-aemitir-n"></span></div>
    </div>
  </section>
  <div class="minor">
    <span>Pendente, pedido cobrado: <b id="k-pendente">—</b></span>
    <span>A conferir: <b id="k-conferir">—</b></span>
    <span>Prazo de recebimento: <b>40 dias</b> após a emissão</span>
  </div>

  <section>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-receb" aria-selected="true" data-v="receb">Recebimentos<span class="count" id="c-receb">0</span></button>
      <button class="tab" role="tab" id="tab-meses" aria-selected="false" data-v="meses">Por mês</button>
      <button class="tab" role="tab" id="tab-div" aria-selected="false" data-v="div">Divergências<span class="count" id="c-div">0</span></button>
    </div>

    <div id="v-receb">
      <div class="list" id="l-areceber"></div>
      <div class="subhead"><h3>Recebidas</h3><div class="tot num" id="t-recebidas"></div></div>
      <div class="list" id="l-recebidas"></div>
    </div>

    <div id="v-meses" hidden>
      <div class="filters" id="filters">
        <button class="chip" data-f="todos" aria-pressed="true">Todos</button>
        <button class="chip" data-f="emitida" aria-pressed="false">Emitidas</button>
        <button class="chip" data-f="pendente" aria-pressed="false">Pendentes</button>
        <button class="chip" data-f="a_emitir" aria-pressed="false">Falta tirar</button>
        <button class="chip" data-f="conferir" aria-pressed="false">A conferir</button>
      </div>
      <div id="months"></div>
      <details class="add">
        <summary>Adicionar orçamento</summary>
        <form class="add" id="addform">
          <label for="f-mes">Mês<input id="f-mes" type="month" required></label>
          <label for="f-cod">Nº<input id="f-cod" placeholder="1.1"></label>
          <label for="f-desc">Descrição<input id="f-desc" required placeholder="Corretiva refrigeração L.Física GO e DF"></label>
          <label for="f-valor">Valor (R$)<input id="f-valor" required inputmode="decimal" placeholder="12.345,67"></label>
          <label for="f-status">Situação<select id="f-status"><option value="a_emitir">Falta tirar</option><option value="pendente">Pendente · pedido cobrado</option><option value="emitida">Emitida</option><option value="conferir">A conferir</option></select></label>
          <button class="btn btn-primary" type="submit">Adicionar</button>
        </form>
        <div class="toast" id="toast"></div>
      </details>
    </div>

    <div id="v-div" hidden>
      <ul class="avisos" id="avisos"></ul>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function () {
  const PRAZO = 40;
  const ST = { emitida: "Emitida", pendente: "Pendente", a_emitir: "Falta tirar", conferir: "A conferir" };
  const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const brl = v => (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const soma = l => l.reduce((s, r) => s + (Number(r.valor) || 0), 0);
  const mesLabel = m => { const [y, mm] = String(m).split("-"); return (MESES[Number(mm) - 1] || m) + " " + y; };
  const hoje = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
  const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const parse = s => { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const fmt = d => d ? d.toLocaleDateString("pt-BR") : "";
  const addDias = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  let rows = [], avisos = [], filtro = "todos", db = null, view = "receb";

  const toRow = r => ({ _id: r.id, mes: r.mes, cod: r.cod, desc: r.descricao, valor: Number(r.valor), status: r.status, nf: r.nf, obs: r.obs, alerta: r.alerta, recebida: r.recebida, recebidaEm: r.recebida_em || "", emitidaEm: r.emitida_em || "" });
  const COLS = { desc: "descricao", recebidaEm: "recebida_em", emitidaEm: "emitida_em" };
  const toDb = p => { const o = {}; for (const k in p) o[COLS[k] || k] = ((k === "recebidaEm" || k === "emitidaEm") && !p[k]) ? null : p[k]; return o; };

  // previsão de recebimento e situação do prazo
  function prazo(r) {
    const em = parse(r.emitidaEm);
    if (!em) return { prev: null, dias: null, cls: "b-muted", txt: "Sem data de emissão" };
    const prev = addDias(em, PRAZO), dias = Math.round((prev - hoje()) / 864e5);
    if (dias < 0) return { prev, dias, cls: "b-bad", txt: "Vencida há " + (-dias) + (dias === -1 ? " dia" : " dias") };
    if (dias === 0) return { prev, dias, cls: "b-warn", txt: "Vence hoje" };
    if (dias <= 7) return { prev, dias, cls: "b-warn", txt: "Vence em " + dias + (dias === 1 ? " dia" : " dias") };
    return { prev, dias, cls: "b-ok", txt: "No prazo · " + dias + " dias" };
  }

  // abas
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
    view = t.dataset.v;
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t ? "true" : "false"));
    ["receb", "meses", "div"].forEach(v => document.getElementById("v-" + v).hidden = v !== view);
  }));
  document.querySelectorAll("#filters .chip").forEach(b => b.addEventListener("click", () => {
    filtro = b.dataset.f;
    document.querySelectorAll("#filters .chip").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    renderMeses();
  }));

  function renderResumo() {
    const em = rows.filter(r => r.status === "emitida");
    const ar = em.filter(r => !r.recebida), rc = em.filter(r => r.recebida);
    const venc = ar.filter(r => { const p = prazo(r); return p.dias != null && p.dias < 0; });
    const ae = rows.filter(r => r.status === "a_emitir");
    const set = (id, l, unid) => { document.getElementById(id).textContent = brl(soma(l)); document.getElementById(id + "-n").textContent = l.length + " " + unid + (l.length === 1 ? "" : "s"); };
    set("k-areceber", ar, "nota"); set("k-vencido", venc, "nota"); set("k-recebido", rc, "nota"); set("k-aemitir", ae, "orçamento");
    document.getElementById("k-pendente").textContent = brl(soma(rows.filter(r => r.status === "pendente")));
    document.getElementById("k-conferir").textContent = brl(soma(rows.filter(r => r.status === "conferir")));
    document.getElementById("c-receb").textContent = ar.length;
    document.getElementById("c-div").textContent = avisos.length;
  }

  function dataInput(r, campo, label) {
    const i = el("input", "date"); i.type = "date"; i.id = campo + "-" + r._id; i.value = r[campo] || ""; i.setAttribute("aria-label", label + " de " + (r.desc || ""));
    i.addEventListener("change", () => save(r._id, { [campo]: i.value }));
    return i;
  }

  function renderReceb() {
    const em = rows.filter(r => r.status === "emitida");
    const ar = em.filter(r => !r.recebida).sort((a, b) => { const pa = prazo(a), pb = prazo(b); return (pa.dias ?? -1e9) - (pb.dias ?? -1e9) || String(a.mes).localeCompare(b.mes); });
    const rc = em.filter(r => r.recebida).sort((a, b) => String(b.recebidaEm).localeCompare(String(a.recebidaEm)) || String(b.mes).localeCompare(a.mes));
    const box = document.getElementById("l-areceber");
    if (!ar.length) box.replaceChildren(el("div", "empty", "Nenhuma nota emitida esperando pagamento."));
    else box.replaceChildren(...ar.map(r => {
      const p = prazo(r), it = el("div", "item");
      const a = el("div"); a.append(el("div", "t", r.desc), el("div", "s", mesLabel(r.mes) + (r.nf ? " · NF " + r.nf : "")));
      const w = el("div", "when"); w.append(el("span", "badge " + p.cls, p.txt));
      const d = el("div", "d");
      if (p.prev) d.textContent = "Emissão " + fmt(parse(r.emitidaEm)) + " · previsão " + fmt(p.prev);
      else { d.textContent = "Emissão: "; d.append(dataInput(r, "emitidaEm", "Data de emissão")); }
      w.append(d);
      const v = el("div", "val", brl(r.valor));
      const act = el("div", "act"); const b = el("button", "btn btn-primary", "Marcar recebida"); b.type = "button";
      b.addEventListener("click", () => { b.disabled = true; save(r._id, { recebida: true, recebidaEm: iso(hoje()) }); });
      act.append(b);
      it.append(a, w, v, act); return it;
    }));
    document.getElementById("t-recebidas").textContent = rc.length ? rc.length + (rc.length === 1 ? " nota · " : " notas · ") + brl(soma(rc)) : "";
    const lb = document.getElementById("l-recebidas");
    if (!rc.length) lb.replaceChildren(el("div", "empty", "Quando você marcar uma nota como recebida, ela aparece aqui."));
    else lb.replaceChildren(...rc.map(r => {
      const it = el("div", "item");
      const a = el("div"); a.append(el("div", "t", r.desc), el("div", "s", mesLabel(r.mes) + (r.nf ? " · NF " + r.nf : "")));
      const w = el("div", "when"); w.append(el("span", "badge b-ok", "Recebida"));
      const d = el("div", "d"); d.textContent = "em "; d.append(dataInput(r, "recebidaEm", "Data do recebimento")); w.append(d);
      const v = el("div", "val", brl(r.valor));
      const act = el("div", "act"); const b = el("button", "btn btn-ghost", "Desfazer"); b.type = "button";
      b.addEventListener("click", () => { b.disabled = true; save(r._id, { recebida: false, recebidaEm: "" }); });
      act.append(b);
      it.append(a, w, v, act); return it;
    }));
  }

  function renderMeses() {
    const box = document.getElementById("months");
    const list = rows.filter(r => filtro === "todos" || r.status === filtro);
    if (!list.length) { box.replaceChildren(el("div", "empty", rows.length ? "Nenhum orçamento com essa situação." : "Nenhum orçamento ainda. Use \"Adicionar orçamento\" abaixo.")); return; }
    const months = [...new Set(list.map(r => r.mes))].sort().reverse();
    box.replaceChildren(...months.flatMap(m => {
      const all = rows.filter(r => r.mes === m);
      const items = list.filter(r => r.mes === m).sort((a, b) => String(a.cod || "~").localeCompare(String(b.cod || "~"), "pt-BR", { numeric: true }));
      const h = el("div", "subhead"); h.append(el("h3", null, mesLabel(m)));
      const tot = el("div", "tot num"); tot.append(el("span", null, "Total " + brl(soma(all))));
      const fa = soma(all.filter(r => r.status === "a_emitir")); if (fa) tot.append(el("span", null, "Falta tirar " + brl(fa)));
      h.append(tot);
      return [h, ...items.map(r => {
        const row = el("div", "row");
        row.append(el("div", "cod", r.cod || "–"));
        const d = el("div"); d.append(el("div", "t", r.desc));
        if (r.obs) d.append(el("div", "obs" + (r.alerta ? " alert" : ""), r.obs));
        if (r.status === "emitida") { const e = el("div", "em"); e.append("Emissão", dataInput(r, "emitidaEm", "Data de emissão")); if (r.recebida) e.append(el("span", "badge b-ok", "Recebida")); d.append(e); }
        row.append(d, el("div", "val", brl(r.valor)));
        const sc = el("div", "stc"); const sel = el("select", "st s-" + r.status); sel.id = "st-" + r._id; sel.setAttribute("aria-label", "Situação de " + (r.desc || ""));
        for (const k in ST) { const o = el("option", null, ST[k]); o.value = k; if (k === r.status) o.selected = true; sel.append(o); }
        sel.addEventListener("change", () => { const p = { status: sel.value }; if (sel.value === "emitida" && !r.emitidaEm) p.emitidaEm = iso(hoje()); save(r._id, p); });
        sc.append(sel);
        const nc = el("div", "nfc"); const inp = el("input", "nf"); inp.id = "nf-" + r._id; inp.value = r.nf || ""; inp.placeholder = "nº NF"; inp.setAttribute("aria-label", "Número da NF de " + (r.desc || ""));
        inp.addEventListener("change", () => save(r._id, { nf: inp.value.trim() }));
        nc.append(inp);
        row.append(sc, nc); return row;
      })];
    }));
  }

  function renderAvisos() {
    const ul = document.getElementById("avisos");
    if (!avisos.length) { ul.replaceChildren(el("li", null, "Nenhuma divergência registrada.")); return; }
    ul.replaceChildren(...[...avisos].sort((a, b) => (a.ordem || 0) - (b.ordem || 0)).map(a => {
      const li = el("li"); li.style.setProperty("--c", a.nivel === "ok" ? "var(--ok)" : a.nivel === "alto" ? "var(--bad)" : "var(--warn)");
      li.append(el("b", null, a.titulo || ""), el("p", null, a.texto || "")); return li;
    }));
  }

  function renderAll() { renderResumo(); renderReceb(); renderMeses(); renderAvisos(); }
  const setConn = t => document.getElementById("conn").textContent = t;

  async function save(id, patch) {
    const { error } = await db.from(T.notas).update(toDb(patch)).eq("id", id);
    if (error) {
      setConn(/emitida_em/.test(error.message) ? "Falta criar o campo de data de emissão no banco." : "Não foi possível salvar: " + error.message);
      renderAll(); return;
    }
    const r = rows.find(x => x._id === id); if (r) Object.assign(r, patch);
    setConn("Salvo"); renderAll();
  }

  async function carregar() {
    const [n, a] = await Promise.all([db.from(T.notas).select("*"), db.from(T.avisos).select("*")]);
    if (n.error) { setConn("Erro ao carregar: " + n.error.message); return; }
    rows = n.data.map(toRow); avisos = a.data || [];
    setConn(rows.length ? "Atualizado às " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "Seu e-mail ainda não foi liberado, ou o banco está vazio.");
    renderAll();
  }

  document.getElementById("addform").addEventListener("submit", async ev => {
    ev.preventDefault();
    const toast = document.getElementById("toast");
    const valor = Number(document.getElementById("f-valor").value.trim().replace(/[^\d,.-]/g, "").replace(/\./g, "").replace(",", "."));
    if (!isFinite(valor) || valor <= 0) { toast.textContent = "Informe o valor no formato 12.345,67."; return; }
    const status = document.getElementById("f-status").value;
    const novo = { mes: document.getElementById("f-mes").value, cod: document.getElementById("f-cod").value.trim(), desc: document.getElementById("f-desc").value.trim(), valor, status, nf: "", obs: "" };
    if (status === "emitida") novo.emitidaEm = iso(hoje());
    const { error } = await db.from(T.notas).insert(toDb(novo));
    if (error) { toast.textContent = "Não foi possível salvar: " + error.message; return; }
    toast.textContent = "Orçamento adicionado."; ev.target.reset(); document.getElementById("f-mes").value = iso(hoje()).slice(0, 7);
    carregar();
  });
  document.getElementById("f-mes").value = iso(hoje()).slice(0, 7);

  function entrar() { document.getElementById("login").hidden = true; document.getElementById("app").hidden = false; carregar(); }
  function sair() { document.getElementById("app").hidden = true; document.getElementById("login").hidden = false; }

  if (!window.supabase || !window.SUPABASE_URL) { document.getElementById("login-msg").textContent = "Falta configurar o Supabase em config.js."; return; }
  const T = Object.assign({ notas: "arbracom_notas", avisos: "arbracom_avisos" }, window.TABELAS || {});
  db = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  document.getElementById("loginform").addEventListener("submit", async ev => {
    ev.preventDefault();
    const msg = document.getElementById("login-msg"); msg.textContent = "Entrando…";
    const { error } = await db.auth.signInWithPassword({ email: document.getElementById("l-email").value.trim(), password: document.getElementById("l-senha").value });
    if (error) { msg.textContent = "E-mail ou senha incorretos."; return; }
    msg.textContent = ""; entrar();
  });
  document.getElementById("sair").addEventListener("click", async () => { await db.auth.signOut(); sair(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !document.getElementById("app").hidden) carregar(); });
  db.auth.getSession().then(({ data }) => { if (data.session) entrar(); });
})();
</script>
</body>
</html>
